# GradED — full demo in one command:  docker compose up
#
#   nodes     — 7 live genesis-validator nodes on one asyncio loop, each with an
#               HTTP bridge (8080-8086) that the browser polls directly.
#   frontend  — a static file server for frontend/ on :8090.
#
# The frontend is plain HTML/JS; the browser reaches the bridges directly on
# 127.0.0.1:8080-8086 (CORS on the bridge is permissive), so both services just
# publish their ports to the host — no inter-container networking required.
services:
  nodes:
    build: .
    image: graded
    command: ["python", "-m", "network.run_nodes", "--nodes", "7"]
    ports:
      # HTTP bridges: node i is reachable at http://127.0.0.1:808{i}.
      - "8080-8086:8080-8086"
    environment:
      HS_FOB_HTTP_HOST: "0.0.0.0"
      HS_FOB_HTTP_PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/node')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    # Reuse the exact image the nodes service builds; just serve frontend/.
    image: graded
    command: ["python", "-m", "http.server", "8090", "--directory", "frontend", "--bind", "0.0.0.0"]
    ports:
      - "8090:8090"
    depends_on:
      - nodes
